name: Build DLSS Swapper (Linux)

on:
  push:
    tags:
      - v1.*
      - v2.*
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm zstd binutils flatpak flatpak-builder libfuse2

      - name: Setup Flatpak Builder Flathub Remote & Runtimes
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo || true
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08 || true
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo || true
          sudo flatpak install -y flathub org.freedesktop.Platform/x86_64/24.08 org.freedesktop.Sdk/x86_64/24.08 || true

      - name: Extract version from csproj
        id: get_version
        run: |
          VERSION=$(grep -oPm1 "(?<=<Version>)[^<]+" src/LinuxUI/LinuxUI.csproj || echo "1.2.6.0")
          SHORT_VERSION=$(echo $VERSION | cut -d. -f1,2,3)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "SHORT_VERSION=$SHORT_VERSION" >> $GITHUB_ENV
          echo "Extracted Version: $VERSION (Short: $SHORT_VERSION)"

      - name: Build all Linux packages (.deb, .rpm, .pkg.tar.zst, .AppImage, .flatpak)
        run: |
          chmod +x package/linux/build_all.sh
          chmod +x package/linux/**/*.sh
          ./package/linux/build_all.sh

      - name: Collect all distribution packages
        run: |
          mkdir -p dist_all
          find package/linux -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.pkg.tar.zst" -o -name "*.AppImage" -o -name "*.flatpak" \) -exec cp {} dist_all/ \;
          echo "=== Built Packages ==="
          ls -la dist_all/

      - name: Upload Linux Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DLSS-Swapper-Linux-${{ env.SHORT_VERSION }}
          path: dist_all/*
          if-no-files-found: error

      - name: Publish Packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist_all/*
          generate_release_notes: true
          draft: false
          prerelease: false
